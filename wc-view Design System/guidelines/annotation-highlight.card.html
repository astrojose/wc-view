<!-- @dsCard group="Geometry" viewport="700x200" name="Annotation Highlight" subtitle="3px champagne rule + 6% tint; dashed muted rule when orphaned" -->
<!doctype html><html data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{background:var(--bg-base);color:var(--fg-primary);font-family:var(--font-sans);letter-spacing:var(--tracking-tight);padding:var(--space-5);box-sizing:border-box}a{color:var(--accent-action)}a:hover{color:var(--fg-primary)}.lbl{font:var(--type-meta);color:var(--fg-muted);letter-spacing:var(--tracking-wide);text-transform:uppercase}.mono{font:var(--type-code)}.row{display:flex;gap:var(--space-3);align-items:flex-start;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:var(--space-2);min-width:6.5rem}.chip{height:3rem;border-radius:var(--radius);border:1px solid var(--border-subtle)}</style></head><body style="display:flex;flex-direction:column;gap:var(--space-3)">
<div style="border-left:var(--annotation-bar-width) solid var(--annotation-bar);background:var(--annotation-tint);padding:var(--space-2) var(--space-4);font:var(--type-body);color:var(--fg-secondary)">Annotated — the anchor resolved against the rendered quote.</div>
<div style="border-left:var(--annotation-bar-width) solid var(--annotation-bar);background:var(--annotation-tint-strong);padding:var(--space-2) var(--space-4);font:var(--type-body);color:var(--fg-primary)">Active — currently under review.</div>
<div style="border-left:var(--annotation-bar-width) dashed var(--status-orphaned);background:transparent;padding:var(--space-2) var(--space-4);font:var(--type-body);color:var(--fg-muted)">Orphaned — the span was rewritten past fuzzy recognition.</div>
</body></html>
