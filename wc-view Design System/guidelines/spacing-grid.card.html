<!-- @dsCard group="Spacing" viewport="700x150" name="4px Grid" subtitle="0.25rem base step; all padding and gaps are multiples" -->
<!doctype html><html data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{background:var(--bg-base);color:var(--fg-primary);font-family:var(--font-sans);letter-spacing:var(--tracking-tight);padding:var(--space-5);box-sizing:border-box}a{color:var(--accent-action)}a:hover{color:var(--fg-primary)}.lbl{font:var(--type-meta);color:var(--fg-muted);letter-spacing:var(--tracking-wide);text-transform:uppercase}.mono{font:var(--type-code)}.row{display:flex;gap:var(--space-3);align-items:flex-start;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:var(--space-2);min-width:6.5rem}.chip{height:3rem;border-radius:var(--radius);border:1px solid var(--border-subtle)}</style></head><body><div class="row" style="align-items:flex-end">
<div class="sw" style="min-width:0"><div style="width:0.25rem;height:0.25rem;background:var(--ring-accent);border-radius:var(--radius-sm)"></div><div class="mono" style="font-size:var(--text-xs)">--space-1</div><div class="lbl">0.25rem</div></div><div class="sw" style="min-width:0"><div style="width:0.5rem;height:0.5rem;background:var(--ring-accent);border-radius:var(--radius-sm)"></div><div class="mono" style="font-size:var(--text-xs)">--space-2</div><div class="lbl">0.5rem</div></div><div class="sw" style="min-width:0"><div style="width:0.75rem;height:0.75rem;background:var(--ring-accent);border-radius:var(--radius-sm)"></div><div class="mono" style="font-size:var(--text-xs)">--space-3</div><div class="lbl">0.75rem</div></div><div class="sw" style="min-width:0"><div style="width:1rem;height:1rem;background:var(--ring-accent);border-radius:var(--radius-sm)"></div><div class="mono" style="font-size:var(--text-xs)">--space-4</div><div class="lbl">1rem</div></div><div class="sw" style="min-width:0"><div style="width:1.5rem;height:1.5rem;background:var(--ring-accent);border-radius:var(--radius-sm)"></div><div class="mono" style="font-size:var(--text-xs)">--space-6</div><div class="lbl">1.5rem</div></div><div class="sw" style="min-width:0"><div style="width:2rem;height:2rem;background:var(--ring-accent);border-radius:var(--radius-sm)"></div><div class="mono" style="font-size:var(--text-xs)">--space-8</div><div class="lbl">2rem</div></div><div class="sw" style="min-width:0"><div style="width:3rem;height:3rem;background:var(--ring-accent);border-radius:var(--radius-sm)"></div><div class="mono" style="font-size:var(--text-xs)">--space-12</div><div class="lbl">3rem</div></div>
</div></body></html>
