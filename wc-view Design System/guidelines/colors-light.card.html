<!-- @dsCard group="Colors" viewport="700x150" name="Light Mode" subtitle="[data-theme=light]: zinc surfaces, near-black ring accent and action" -->
<!doctype html><html data-theme="light"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{background:var(--bg-base);color:var(--fg-primary);font-family:var(--font-sans);letter-spacing:var(--tracking-tight);padding:var(--space-5);box-sizing:border-box}a{color:var(--accent-action)}a:hover{color:var(--fg-primary)}.lbl{font:var(--type-meta);color:var(--fg-muted);letter-spacing:var(--tracking-wide);text-transform:uppercase}.mono{font:var(--type-code)}.row{display:flex;gap:var(--space-3);align-items:flex-start;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:var(--space-2);min-width:6.5rem}.chip{height:3rem;border-radius:var(--radius);border:1px solid var(--border-subtle)}</style></head><body><div class="row">
<div class="sw"><div class="chip" style="background:#FCFCFC"></div><div class="mono" style="font-size:var(--text-xs)">--bg-base</div><div class="lbl">page</div></div>
<div class="sw"><div class="chip" style="background:#FFFFFF"></div><div class="mono" style="font-size:var(--text-xs)">--surface-card</div><div class="lbl">card</div></div>
<div class="sw"><div class="chip" style="background:#E4E4E7"></div><div class="mono" style="font-size:var(--text-xs)">--border-subtle</div><div class="lbl">hairline</div></div>
<div class="sw"><div class="chip" style="background:#18181B"></div><div class="mono" style="font-size:var(--text-xs)">--ring-accent</div><div class="lbl">annotation, action</div></div>
<div class="sw"><div class="chip" style="background:#71717A"></div><div class="mono" style="font-size:var(--text-xs)">--fg-muted</div><div class="lbl">muted zinc</div></div>
</div></body></html>
