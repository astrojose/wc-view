<!-- @dsCard group="Colors" viewport="700x150" name="Feedback Status" subtitle="unresolved → in_progress → resolved, plus orphaned; label always accompanies colour" -->
<!doctype html><html data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{background:var(--bg-base);color:var(--fg-primary);font-family:var(--font-sans);letter-spacing:var(--tracking-tight);padding:var(--space-5);box-sizing:border-box}a{color:var(--accent-action)}a:hover{color:var(--fg-primary)}.lbl{font:var(--type-meta);color:var(--fg-muted);letter-spacing:var(--tracking-wide);text-transform:uppercase}.mono{font:var(--type-code)}.row{display:flex;gap:var(--space-3);align-items:flex-start;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:var(--space-2);min-width:6.5rem}.chip{height:3rem;border-radius:var(--radius);border:1px solid var(--border-subtle)}</style></head><body><div class="row">
<div class="sw"><div class="chip" style="background:#F26A4B"></div><div class="mono" style="font-size:var(--text-xs)">--status-unresolved</div><div class="lbl">unresolved</div></div>
<div class="sw"><div class="chip" style="background:#D9A84E"></div><div class="mono" style="font-size:var(--text-xs)">--status-in-progress</div><div class="lbl">in_progress</div></div>
<div class="sw"><div class="chip" style="background:#7FB77E"></div><div class="mono" style="font-size:var(--text-xs)">--status-resolved</div><div class="lbl">resolved</div></div>
<div class="sw"><div class="chip" style="background:#8E8A83"></div><div class="mono" style="font-size:var(--text-xs)">--status-orphaned</div><div class="lbl">orphaned (anchor lost)</div></div>
</div></body></html>
