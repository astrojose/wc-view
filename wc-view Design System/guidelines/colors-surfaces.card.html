<!-- @dsCard group="Colors" viewport="700x150" name="Surfaces & Borders (dark)" subtitle="Dark is the default theme: near-black base, one step of raise, hairline borders" -->
<!doctype html><html data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{background:var(--bg-base);color:var(--fg-primary);font-family:var(--font-sans);letter-spacing:var(--tracking-tight);padding:var(--space-5);box-sizing:border-box}a{color:var(--accent-action)}a:hover{color:var(--fg-primary)}.lbl{font:var(--type-meta);color:var(--fg-muted);letter-spacing:var(--tracking-wide);text-transform:uppercase}.mono{font:var(--type-code)}.row{display:flex;gap:var(--space-3);align-items:flex-start;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:var(--space-2);min-width:6.5rem}.chip{height:3rem;border-radius:var(--radius);border:1px solid var(--border-subtle)}</style></head><body><div class="row">
<div class="sw"><div class="chip" style="background:#121212"></div><div class="mono" style="font-size:var(--text-xs)">--bg-base</div><div class="lbl">page</div></div>
<div class="sw"><div class="chip" style="background:#1C1C1C"></div><div class="mono" style="font-size:var(--text-xs)">--surface-card</div><div class="lbl">card / composer</div></div>
<div class="sw"><div class="chip" style="background:#242424"></div><div class="mono" style="font-size:var(--text-xs)">--surface-raised</div><div class="lbl">hover / raised</div></div>
<div class="sw"><div class="chip" style="background:#171717"></div><div class="mono" style="font-size:var(--text-xs)">--surface-inset</div><div class="lbl">code / input</div></div>
<div class="sw"><div class="chip" style="background:#2C2C2C"></div><div class="mono" style="font-size:var(--text-xs)">--border-subtle</div><div class="lbl">hairline</div></div>
<div class="sw"><div class="chip" style="background:#3A3A3A"></div><div class="mono" style="font-size:var(--text-xs)">--border-strong</div><div class="lbl">overlay edge</div></div>
</div></body></html>
