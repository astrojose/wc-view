<!doctype html><html data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{background:var(--bg-base);color:var(--fg-primary);font-family:var(--font-sans);letter-spacing:var(--tracking-tight);padding:var(--space-5);box-sizing:border-box}a{color:var(--accent-action)}a:hover{color:var(--fg-primary)}.lbl{font:var(--type-meta);color:var(--fg-muted);letter-spacing:var(--tracking-wide);text-transform:uppercase}.mono{font:var(--type-code)}.row{display:flex;gap:var(--space-3);align-items:flex-start;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:var(--space-2);min-width:6.5rem}.chip{height:3rem;border-radius:var(--radius);border:1px solid var(--border-subtle)}@keyframes rise{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}.demo{animation:rise 180ms var(--ease-out) infinite alternate}</style></head><body><div class="row" style="align-items:center">
<div class="demo" style="background:var(--surface-card);border:1px solid var(--border-strong);border-radius:var(--radius);padding:var(--space-3) var(--space-4);font:var(--type-ui);box-shadow:var(--shadow-ambient)">Popover enter</div>
<div class="mono" style="font-size:var(--text-xs);color:var(--fg-muted)">--dur-instant 80ms · --dur-fast 120ms · --dur-normal 180ms<br>--ease-standard cubic-bezier(.2,0,.2,1) · --lift-enter translateY(4px)<br>prefers-reduced-motion → 0ms</div>
</div></body></html>
