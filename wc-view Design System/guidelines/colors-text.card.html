<!doctype html><html data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{background:var(--bg-base);color:var(--fg-primary);font-family:var(--font-sans);letter-spacing:var(--tracking-tight);padding:var(--space-5);box-sizing:border-box}a{color:var(--accent-action)}a:hover{color:var(--fg-primary)}.lbl{font:var(--type-meta);color:var(--fg-muted);letter-spacing:var(--tracking-wide);text-transform:uppercase}.mono{font:var(--type-code)}.row{display:flex;gap:var(--space-3);align-items:flex-start;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:var(--space-2);min-width:6.5rem}.chip{height:3rem;border-radius:var(--radius);border:1px solid var(--border-subtle)}</style></head><body><div class="row" style="align-items:center">
<div><div style="font:var(--type-heading);color:var(--fg-primary)">Aa primary</div><div class="mono" style="font-size:var(--text-xs);color:var(--fg-muted)">--fg-primary #EDEBE4</div></div>
<div><div style="font:var(--type-heading);color:var(--fg-secondary)">Aa secondary</div><div class="mono" style="font-size:var(--text-xs);color:var(--fg-muted)">--fg-secondary #D1CFC0</div></div>
<div><div style="font:var(--type-heading);color:var(--fg-muted)">Aa muted</div><div class="mono" style="font-size:var(--text-xs);color:var(--fg-muted)">--fg-muted #8E8A83</div></div>
</div></body></html>
