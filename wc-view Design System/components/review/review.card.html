<!doctype html><html data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>html,body{margin:0}body{background:var(--bg-base);color:var(--fg-primary);font-family:var(--font-sans);letter-spacing:var(--tracking-tight);padding:var(--space-5)}a{color:var(--accent-action)}a:hover{color:var(--fg-primary)}.lbl{font:var(--type-meta);color:var(--fg-muted);letter-spacing:var(--tracking-wide);text-transform:uppercase;margin:0 0 var(--space-2)}.row{display:flex;gap:var(--space-3);align-items:center;flex-wrap:wrap}.stack{display:flex;flex-direction:column;gap:var(--space-4)}svg.lucide{width:1rem;height:1rem}</style></head><body><div id="root"></div>

<script type="text/babel">
