agent:
  name: workflow-contract
  short_description: "Route docs work through the workflow contract"
  default_prompt: |
    Use $workflow-contract.
    Before touching any file:
    1. Read canonical spec files in order.
    2. Classify layer, lifecycle state, mode (Thinking | Investigation | Execution | Review), class (direct | planned | decision | incident), and coordination (single-repo | cross-repo).
    3. For non-trivial work, declare mode, class, task status, authority, and next gate. Announce mode or class transitions.
    4. Use scoped explicit approval before behavior-changing execution or additional authority. Recommend model-agnostic reasoning effort for the next action.
    5. Bootstrap structure if missing. Planned tasks must pass readiness before in-progress; direct work must declare objective, scope, authority, acceptance criteria, and verification.
    6. Review before completion. Map every AC-NN criterion to evidence; only reconciled-and-verified work is done. Block incomplete proof, design drift, or required decisions; cancel reverted or superseded work.
    7. Run python3 .agents/workflows/workflow-contract/scripts/validate_workflow.py and fix all failures before completion.
